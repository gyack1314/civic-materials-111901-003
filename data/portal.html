<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>企业披露资料申请</title><style>body{font:18px sans-serif;margin:40px}button,select{font-size:18px;margin:8px}article{padding:15px;border:1px solid #aaa;margin:12px}a{display:block;margin:8px}</style>
<h1>企业披露资料申请</h1><label>企业<select id="company"><option value="C01">同名实业 C01</option><option value="C02">同名实业 C02</option></select></label><label>年度<select id="year"><option>2025</option><option>2024</option></select></label><h2 id="title"></h2><p id="context" data-ready="no">正在刷新</p><button id="apply" disabled>申请导出</button><button id="refresh">刷新申请记录</button><p id="message"></p><p id="quota"></p><section id="jobs"></section>
<script>
let confirmed=null;
async function context(){confirmed=null;document.querySelector('#apply').disabled=true;let c=document.querySelector('#company').value,y=document.querySelector('#year').value;document.querySelector('#title').textContent=c+' / '+y;document.querySelector('#context').dataset.ready='no';await new Promise(r=>setTimeout(r,130));let v=await (await fetch('/context?company='+c+'&year='+y)).json();confirmed=v;document.querySelector('#context').textContent='企业代码 '+v.company+'；报告期 '+v.year+'；披露范围 '+v.scope;document.querySelector('#context').dataset.ready='yes';document.querySelector('#apply').disabled=false;}
async function refresh(){let v=await(await fetch('/jobs')).json();document.querySelector('#quota').textContent='额度已使用 '+v.quota_used;let section=document.querySelector('#jobs');section.replaceChildren();for(let j of v.jobs){let a=document.createElement('article');a.dataset.application=j.id;a.dataset.state=j.state;let p=document.createElement('p');p.textContent='申请 '+j.id+' 企业 '+j.company+' 年度 '+j.year+' 范围 '+j.scope+' 状态 '+j.state+' 办理 '+j.actor;a.append(p);let b=document.createElement('button');b.textContent='领取原件地址';b.dataset.ticket=j.id;b.disabled=j.state!=='ready';b.onclick=async()=>{let v=await(await fetch('/ticket?id='+j.id+'&session=browser')).json();for(let f of v.links){let link=document.createElement('a');link.href=f.url;link.download=j.id+'-'+f.part+'.txt';link.textContent=f.part==='main'?'正文':'补充册';a.append(link)}};a.append(b);section.append(a)}}
document.querySelector('#company').onchange=context;document.querySelector('#year').onchange=context;document.querySelector('#refresh').onclick=refresh;document.querySelector('#apply').onclick=async()=>{document.querySelector('#apply').disabled=true;try{let v=await(await fetch('/apply',{method:'POST',body:JSON.stringify(confirmed)})).json();document.querySelector('#message').textContent='已受理 '+v.accepted}catch(e){document.querySelector('#message').textContent='申请结果尚未确认，请核对申请记录'}finally{document.querySelector('#apply').disabled=false;refresh()}};context();refresh();
</script></html>
